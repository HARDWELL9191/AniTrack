name: Build JellyReco (Windows ARM64)

on:
  push:
    branches: [jellyreco]
    paths:
      - "jellyreco/**"
      - "!jellyreco/tools/prepare_deps_linux.sh"
      - "!jellyreco/tools/ci_run.sh"
      - ".github/workflows/build-jellyreco.yml"
  workflow_dispatch:

concurrency:
  group: build-jellyreco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # My List / Not for me / Already seen are shared with the iPhone app: the iPhone's own Swift model
  # types (from the jellyfin branch) must decode what this app writes, and the reverse.
  sync-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: jellyreco
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: iPhone app's list types
        run: |
          git fetch --depth 1 origin jellyfin
          mkdir -p "$RUNNER_TEMP/ios" "$RUNNER_TEMP/sync"
          git show FETCH_HEAD:JellyReco/AI/External/ExternalTitle.swift > "$RUNNER_TEMP/ios/ExternalTitle.swift"
          git show FETCH_HEAD:JellyReco/App/MyList.swift > "$RUNNER_TEMP/ios/MyList.swift"
          # Files ExternalTitle.swift uses that are Foundation-only, compiled in as they are.
          for f in JellyReco/AI/External/TMDBCertification.swift; do
            git cat-file -e "FETCH_HEAD:$f" 2>/dev/null && git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/ios/$(basename "$f")"
          done
          swift --version || { echo "::error::No Swift on this runner"; exit 1; }
      - name: Windows writes, iPhone reads, iPhone writes, Windows reads
        run: |
          node tools/sync_check/gen.ts write "$RUNNER_TEMP/sync"
          swiftc -O tools/sync_check/stubs.swift "$RUNNER_TEMP"/ios/*.swift tools/sync_check/main.swift -o "$RUNNER_TEMP/sync-check"
          "$RUNNER_TEMP/sync-check" "$RUNNER_TEMP/sync"
          node tools/sync_check/gen.ts read "$RUNNER_TEMP/sync"
          echo "::notice::My List, Not for me and Already seen round-trip between the Windows and iPhone apps"

  build:
    # Windows 11 on Arm (Snapdragon-class), so the app, libmpv and the checks all run natively on ARM64.
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
        working-directory: jellyreco
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: jellyreco/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Rust (aarch64-pc-windows-msvc)
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            ./rustup-init.exe -y --profile minimal --default-toolchain stable
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-pc-windows-msvc
          rustc -vV
          node -v

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            jellyreco/src-tauri/target
          key: cargo-jellyreco-arm64-${{ hashFiles('jellyreco/src-tauri/Cargo.lock') }}
          restore-keys: cargo-jellyreco-arm64-

      - name: Install packages
        run: npm ci

      - name: Playback engine (libmpv ARM64) and on-device AI files
        run: ./tools/prepare_deps.ps1

      - name: Build the installer
        run: npx tauri build --target aarch64-pc-windows-msvc --bundles nsis

      # Same target and profile as the installer build, so these reuse what it compiled.
      - name: Tests
        working-directory: jellyreco/src-tauri
        run: cargo test --release --lib --target aarch64-pc-windows-msvc

      # Every container / video codec / audio codec / subtitle format in the test set must play to the
      # end through the exact libmpv-2.dll the installer ships, with every audio and subtitle track found.
      - name: Playback check (libmpv, all formats with audio and subtitle tracks)
        working-directory: jellyreco/src-tauri
        run: |
          if (-not $env:FFMPEG_EXE) { throw "no ffmpeg.exe for the test media" }
          python -I ../tools/make_test_media.py $env:FFMPEG_EXE "$env:RUNNER_TEMP/media"
          if ($LASTEXITCODE -ne 0) { throw "making test media failed" }
          cargo build --release --example mpv_check --target aarch64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "mpv_check build failed" }
          python -I ../tools/mpv_check.py target/aarch64-pc-windows-msvc/release/examples/mpv_check.exe resources/mpv/libmpv-2.dll "$env:RUNNER_TEMP/media" "$env:RUNNER_TEMP/mpv-report.json"
          if ($LASTEXITCODE -ne 0) { throw "playback check failed" }

      - name: AI check (real model, this runner has no NPU so it runs on the CPU)
        working-directory: jellyreco/src-tauri
        run: |
          cargo build --release --example embed_check --target aarch64-pc-windows-msvc
          python -I ../tools/ai_check.py target/aarch64-pc-windows-msvc/release/examples/embed_check.exe resources/ai "$env:RUNNER_TEMP/ai-check"
          if ($LASTEXITCODE -ne 0) { throw "AI check failed" }

      - name: Collect the .exe
        run: |
          $setup = Get-ChildItem src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw "No installer was produced" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $setup.FullName out/JellyReco-Setup-arm64.exe
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: JellyReco-Windows-ARM64
          path: jellyreco/out/JellyReco-Setup-arm64.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: JellyReco-playback-report
          path: ${{ runner.temp }}/mpv-report.json
          if-no-files-found: ignore
