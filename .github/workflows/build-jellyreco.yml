name: Build JellyReco

on:
  push:
    branches: [jellyfin]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # GitHub's Xcode 27 image (macOS 27, Apple Silicon) — iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Use custom icon if provided
        run: |
          for f in custom-icon.png custom-icon.jpg custom-icon.jpeg; do
            if [ -f "$f" ]; then
              echo "Using $f as the app icon"
              sips -s format png -z 1024 1024 "$f" --out JellyReco/Assets.xcassets/AppIcon.appiconset/AppIcon.png
              break
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project JellyReco.xcodeproj -scheme JellyReco -derivedDataPath build | tail -20

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project JellyReco.xcodeproj \
            -scheme JellyReco \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/JellyReco.app
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry JellyReco.ipa Payload
          ls -lh JellyReco.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: JellyReco-ipa
          path: JellyReco.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish build errors to the ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/cilog && cd /tmp/cilog
          git init -q && git checkout -q -b ci-logs
          { echo "run ${{ github.run_id }} ${{ github.sha }}"; grep -E "error:|BUILD (SUCCEEDED|FAILED)|fatal" "$GITHUB_WORKSPACE/build.log" | sort -u | head -400; } > build-errors.txt 2>/dev/null || echo "no log" > build-errors.txt
          tail -150 "$GITHUB_WORKSPACE/build.log" > build-tail.txt 2>/dev/null || true
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "build log ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs:ci-logs-build

  formats:
    # Plays generated test files (HEVC 10-bit, AV1, VP9, DTS, TrueHD, E-AC3, FLAC, Opus, ASS,
    # VobSub, WebVTT, mov_text, AVI, WMV, TS, M2TS…) with the exact libmpv build the app ships.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Download MPVUI's libmpv (same build as the app)
        run: |
          set -euo pipefail
          curl -fsSL -o libmpv.zip https://github.com/LePips/MPVUI/releases/download/0.8.0/Libmpv.xcframework.zip
          echo "1bea49b0fa6eef9c475872272d88fd6bf7884d6df5ecfa654cf921c2a2714e7b  libmpv.zip" | shasum -a 256 -c -
          unzip -q libmpv.zip -d libmpv
          find libmpv -maxdepth 3 -name "macos*" -o -maxdepth 3 -name "*.framework" | head

      - name: Build the format tester
        run: |
          set -eo pipefail
          ls -R libmpv | head -40 | tee link.log
          FW=$(find libmpv -type d -path "*macos*" -name "Libmpv.framework" | head -1)
          echo "Framework: $FW"
          BIN="$FW/Libmpv"; [ -f "$FW/Versions/A/Libmpv" ] && BIN="$FW/Versions/A/Libmpv"
          HDR="$FW/Headers"; [ -d "$HDR" ] || HDR="$FW/Versions/A/Headers"
          clang -O2 -arch arm64 -I"$HDR" tools/formattest/formattest.c "$BIN" \
            -framework AVFoundation -framework AVKit -framework AudioToolbox -framework CoreAudio \
            -framework CoreFoundation -framework CoreGraphics -framework CoreImage -framework CoreMedia \
            -framework CoreText -framework CoreVideo -framework Foundation -framework IOSurface \
            -framework Metal -framework QuartzCore -framework Security -framework VideoToolbox \
            -framework AppKit -framework OpenGL -framework IOKit -framework Cocoa \
            -lbz2 -liconv -lexpat -lresolv -lxml2 -lz -lc++ \
            -o formattest 2>&1 | tee -a link.log
          ls -la formattest

      - name: Generate test files
        run: |
          brew install ffmpeg
          tools/formattest/make_samples.sh samples

      - name: Play every file, every audio and subtitle track
        run: |
          ./formattest samples/*.mkv samples/*.mp4 samples/*.avi samples/*.wmv samples/*.ts samples/*.webm samples/*.mov samples/*.m2ts 2>&1 | tee formattest.log

      - name: Publish format test log to the ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/cilog && cd /tmp/cilog
          git init -q && git checkout -q -b ci-logs
          { echo "run ${{ github.run_id }}"; cat "$GITHUB_WORKSPACE/formattest.log" 2>/dev/null; cat "$GITHUB_WORKSPACE/link.log" 2>/dev/null; } > formattest.txt
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "format log ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs:ci-logs-formats

      - name: Upload format test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: format-test
          path: formattest.log
          if-no-files-found: ignore
