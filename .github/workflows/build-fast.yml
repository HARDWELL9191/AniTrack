name: Build AniTrackFast (testing)

# Test build of the faster-launch version: everything pushed to the "fast" branch builds here,
# separate from the main app (which only builds from main). Download "AniTrackFast".

on:
  push:
    branches: [fast]
    paths-ignore:
      - "tools/**"
      - ".github/workflows/api-check.yml"
      - "README.md"
  workflow_dispatch:

jobs:
  build:
    # GitHub's Xcode 27 image (macOS 27, Apple Silicon) — iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Test Excel export writer
        run: |
          set -euo pipefail
          mkdir -p build-test
          xcrun swiftc AniTrack/Services/XLSXWriter.swift tools/xlsx_test/main.swift -o build-test/xlsx_test
          build-test/xlsx_test build-test/sample.xlsx
          python3 -m venv build-test/venv
          build-test/venv/bin/pip install --quiet openpyxl
          build-test/venv/bin/python tools/xlsx_test/verify.py build-test/sample.xlsx

      - name: Upload sample workbook
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xlsx-sample-fast
          path: build-test/sample.xlsx
          if-no-files-found: ignore

      - name: Use custom icon if provided
        run: |
          # Drop any square image named custom-icon.png (or .jpg) in the repo root to use it as the app icon.
          for f in custom-icon.png custom-icon.jpg custom-icon.jpeg; do
            if [ -f "$f" ]; then
              echo "Using $f as the app icon"
              sips -s format png -z 1024 1024 "$f" --out AniTrack/Assets.xcassets/AppIcon.appiconset/AppIcon.png
              break
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AniTrack.xcodeproj \
            -scheme AniTrack \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/AniTrack.app
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AniTrackFast.ipa Payload
          ls -lh AniTrackFast.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: AniTrackFast
          path: AniTrackFast.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
