name: Skip database probe
on: push
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - shell: bash
        run: |
          a="https://api.aniskip.com/v2/skip-times"
          all="types=op&types=ed&types=mixed-op&types=mixed-ed&types=recap"
          try() { echo "=== $1"; curl -sS -g -m 20 -o body.txt -w "HTTP %{http_code}\n" -H "Accept: application/json" -A "JellyReco/1.0" "$1" || true; head -c 1500 body.txt; echo; }
          try "$a/52991/1?$all&episodeLength=0"
          try "$a/52991/1?types[]=op&types[]=ed&types[]=recap&episodeLength=0"
          try "$a/52991/1?$all&episodeLength=1440"
          try "$a/52991/1?$all&episodeLength=1507.1"
          try "$a/52991/1?$all&episodeLength=1530"
          try "$a/52991/1?$all&episodeLength=1600"
          try "$a/52991/1?$all"
          try "$a/52991/999?$all&episodeLength=0"
          try "$a/31240/27?$all&episodeLength=0"
          try "$a/39587/2?$all&episodeLength=0"
          try "$a/39535/1?$all&episodeLength=0"
          try "$a/45576/1?$all&episodeLength=0"
          try "$a/21/500?$all&episodeLength=0"
          try "$a/199/1?$all&episodeLength=0"
          try "$a/99999999/1?$all&episodeLength=0"
          try "https://api.aniskip.com/v2/relation-rules/16498"
          curl -sS -m 60 -o /dev/null -w "fribb full HTTP %{http_code} %{size_download} bytes %{time_total}s\n" https://raw.githubusercontent.com/Fribb/anime-lists/master/anime-list-full.json
