name: JellyReco iOS

on:
  push:
    branches: [jellyfin]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # GitHub's Xcode 27 image (macOS 27, Apple Silicon) — iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Use custom icon if provided
        run: |
          for f in custom-icon.png custom-icon.jpg custom-icon.jpeg; do
            if [ -f "$f" ]; then
              echo "Using $f as the app icon"
              sips -s format png -z 1024 1024 "$f" --out JellyReco/Assets.xcassets/AppIcon.appiconset/AppIcon.png
              break
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project JellyReco.xcodeproj -scheme JellyReco -derivedDataPath build | tail -20

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project JellyReco.xcodeproj \
            -scheme JellyReco \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/JellyReco.app
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry JellyReco.ipa Payload
          ls -lh JellyReco.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: JellyReco-ipa
          path: JellyReco.ipa
          if-no-files-found: error

      - name: Publish the IPA as the "JellyReco latest" release (one fixed download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES="Build $(date -u '+%Y-%m-%d %H:%M UTC') from ${GITHUB_SHA::7}: $(git log -1 --format=%s | head -c 300)"
          gh release delete jellyreco-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create jellyreco-latest JellyReco.ipa -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "JellyReco (latest build)" --notes "$NOTES" --prerelease

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Publish build errors to the ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/cilog && cd /tmp/cilog
          git init -q && git checkout -q -b ci-logs
          { echo "run ${{ github.run_id }} ${{ github.sha }}"; grep -E "error:|BUILD (SUCCEEDED|FAILED)|fatal" "$GITHUB_WORKSPACE/build.log" | sort -u | head -400; } > build-errors.txt 2>/dev/null || echo "no log" > build-errors.txt
          tail -150 "$GITHUB_WORKSPACE/build.log" > build-tail.txt 2>/dev/null || true
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "build log ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs:ci-logs-build

  uitest:
    # Runs real screens in the iOS Simulator and taps them like a finger (screenshots kept).
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Pick a simulator (software keyboard on)
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$UDID"
          xcrun simctl boot "$UDID" || true
      - name: Run UI tests
        run: |
          set -o pipefail
          xcodebuild test -project JellyReco.xcodeproj -scheme JellyReco -destination "id=$UDID" \
            -derivedDataPath build -resultBundlePath uitest.xcresult -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee uitest-full.log | grep -E "RESULT|KEYBOARD|STATE|error:|Test Case|TEST (SUCCEEDED|FAILED)|\*\* " || true
      - name: Publish results and screenshots to the ci-logs-uitest branch
        if: always()
        run: |
          mkdir -p out
          grep -E "RESULT|KEYBOARD|STATE|error:|Test Case|TEST (SUCCEEDED|FAILED)|\*\* " uitest-full.log > out/uitest.txt 2>/dev/null || true
          tail -60 uitest-full.log >> out/uitest.txt 2>/dev/null || true
          xcrun xcresulttool export attachments --path uitest.xcresult --output-path out/shots 2>&1 | tail -3 || true
          ls -la out/shots || true
          cd out && git init -q && git checkout -q -b ci && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "uitest ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci:ci-logs-uitest

  samples:
    # Test files are made on Linux (ffmpeg installs in seconds there; Homebrew builds it from source on new macOS).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Generate test files
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg mkvtoolnix > /dev/null
          ffmpeg -hide_banner -version | head -1
          tools/formattest/make_samples.sh samples 2>&1 | tee samples.log
          cp samples.log samples/
      - uses: actions/upload-artifact@v7
        with:
          name: format-samples
          path: samples/
          if-no-files-found: error

  jellyfin-subs:
    # A real Jellyfin server serves the zlib-compressed PGS track the way the app asks for it.
    needs: samples
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: format-samples
          path: samples
      - name: Start Jellyfin and fetch subtitles like the app
        run: |
          mkdir -p media/zlib && cp samples/render/render_pgs_zlib.mkv "media/zlib/Zlib Test (2020).mkv"
          docker run -d --name jf -p 8096:8096 -v "$PWD/media:/media" jellyfin/jellyfin:latest
          docker exec jf /jellyfin/jellyfin --version 2>/dev/null || true
          tools/jellyfintest/fetch_subs.sh media out 2>&1 | tee out.log
          sudo apt-get install -y -qq ffmpeg >/dev/null
          for f in out/*.pgssub out/*.sup; do
            [ -s "$f" ] || continue
            ffprobe -v error -show_entries stream=codec_name -of csv=p=0 -f sup "$f" | sed "s|^|PROBE $f: |" | tee -a out.log
          done
          docker logs jf 2>&1 | grep -i -E "subtitle|error|exception" | tail -20 | tee -a out.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jellyfin-subs
          path: out/
      - name: Publish log
        if: always()
        run: |
          mkdir -p /tmp/l && cp out.log /tmp/l/jellyfin.txt && cp out/streams.txt /tmp/l/ 2>/dev/null; cd /tmp/l
          git init -q && git checkout -q -b ci && git add -A && git -c user.name=ci -c user.email=ci@local commit -qm log
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci:ci-logs-jellyfin

  formats:
    needs: [samples, jellyfin-subs]
    # Plays generated test files (HEVC 10-bit, AV1, VP9, DTS, TrueHD, E-AC3, FLAC, Opus, ASS,
    # VobSub, WebVTT, mov_text, AVI, WMV, TS, M2TS…) with the exact libmpv build the app ships.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Download MPVUI's libmpv (same build as the app)
        run: |
          set -euo pipefail
          curl -fsSL -o libmpv.zip https://github.com/LePips/MPVUI/releases/download/0.8.0/Libmpv.xcframework.zip
          echo "1bea49b0fa6eef9c475872272d88fd6bf7884d6df5ecfa654cf921c2a2714e7b  libmpv.zip" | shasum -a 256 -c -
          unzip -q libmpv.zip -d libmpv
          find libmpv -maxdepth 3 -name "macos*" -o -maxdepth 3 -name "*.framework" | head

      - name: Build the format tester
        run: |
          set -eo pipefail
          ls -R libmpv | head -40 | tee link.log
          FW=$(find libmpv -type d -path "*macos*" -name "Libmpv.framework" | head -1)
          echo "Framework: $FW"
          BIN="$FW/Libmpv"; [ -f "$FW/Versions/A/Libmpv" ] && BIN="$FW/Versions/A/Libmpv"
          HDR="$FW/Headers"; [ -d "$HDR" ] || HDR="$FW/Versions/A/Headers"
          # The framework keeps client.h at the top of Headers; the C API expects <mpv/client.h>.
          mkdir -p inc/mpv && cp "$HDR"/*.h inc/mpv/
          FWDIR="$(cd "$(dirname "$FW")" && pwd)"
          clang -O2 -arch arm64 -Iinc tools/formattest/formattest.c "$BIN" -Wl,-rpath,"$FWDIR" \
            -framework AVFoundation -framework AVKit -framework AudioToolbox -framework CoreAudio \
            -framework CoreFoundation -framework CoreGraphics -framework CoreImage -framework CoreMedia \
            -framework CoreText -framework CoreVideo -framework Foundation -framework IOSurface \
            -framework Metal -framework QuartzCore -framework Security -framework VideoToolbox \
            -framework AppKit -framework OpenGL -framework IOKit -framework Cocoa \
            -lbz2 -liconv -lexpat -lresolv -lxml2 -lz -lc++ \
            -o formattest 2>&1 | tee -a link.log
          ls -la formattest
          clang -O2 -arch arm64 -Iinc tools/formattest/rendertest.c "$BIN" -Wl,-rpath,"$FWDIR" \
            -framework AVFoundation -framework AVKit -framework AudioToolbox -framework CoreAudio \
            -framework CoreFoundation -framework CoreGraphics -framework CoreImage -framework CoreMedia \
            -framework CoreText -framework CoreVideo -framework Foundation -framework IOSurface \
            -framework Metal -framework QuartzCore -framework Security -framework VideoToolbox \
            -framework AppKit -framework OpenGL -framework IOKit -framework Cocoa \
            -lbz2 -liconv -lexpat -lresolv -lxml2 -lz -lc++ \
            -o rendertest 2>&1 | tee -a link.log

      - name: Get the test files
        uses: actions/download-artifact@v7
        with:
          name: format-samples
          path: samples

      - name: Play every file, every audio and subtitle track
        run: |
          set -o pipefail
          cp samples/samples.log samples.log || true
          shopt -s nullglob
          ./formattest samples/*.mkv samples/*.mp4 samples/*.avi samples/*.wmv samples/*.ts samples/*.webm samples/*.mov samples/*.m2ts 2>&1 | tee formattest.log

      - name: Get the subtitle Jellyfin served
        uses: actions/download-artifact@v7
        with:
          name: jellyfin-subs
          path: jfsubs

      - name: Draw subtitles (PGS, DVB, SRT, coloured ASS) with and without the app's fonts
        if: always()
        run: |
          set -o pipefail
          shopt -s nullglob
          # The app links the iPhone's system fonts into a folder for mpv; do the same with macOS's.
          mkdir -p fonts
          for f in /System/Library/Fonts/Helvetica.ttc /System/Library/Fonts/HelveticaNeue.ttc /System/Library/Fonts/Supplemental/Arial.ttf; do
            [ -f "$f" ] && ln -sf "$f" fonts/
          done
          ls -la fonts | tee rendertest.log
          ./rendertest samples/render/*.mkv samples/render/*.ts 2>&1 | grep -v "^$" | tee -a rendertest.log || true
          ./rendertest --fonts "$PWD/fonts" "Helvetica" samples/render/*.mkv samples/render/*.ts 2>&1 | tee -a rendertest.log || true
          # ffmpeg's demuxer (reads zlib-compressed tracks that mpv's own MKV reader skips)
          # The app's fix: the skipped track fetched from Jellyfin and added over HTTP as its own subtitle.
          subs=(jfsubs/*.pgssub)
          SUB="${subs[0]:-}"
          if [ -n "$SUB" ] && [ -f "$SUB" ]; then
            (cd "$(dirname "$SUB")" && python3 -m http.server 8765 >/dev/null 2>&1 &) ; sleep 2
            # The app's fix: wrap the served PGS in Matroska with the app's own Swift code.
            swiftc -O JellyReco/Player/PGSContainer.swift tools/formattest/sup2mks/main.swift -o sup2mks
            ./sup2mks "$SUB" jfsubs/wrapped.mks | tee -a rendertest.log
            for u in "$PWD/jfsubs/wrapped.mks" "http://127.0.0.1:8765/wrapped.mks" "$PWD/samples/subs.srt" "$PWD/samples/subs.ass" "$PWD/samples/subs.vtt"; do
              echo "=== external subtitle: $u" | tee -a rendertest.log
              curl -s -o /dev/null -w "    (http check: %{http_code})\n" "$u" 2>/dev/null | tee -a rendertest.log || true
              RENDERTEST_LOG=v RENDERTEST_SUBURL="$u" ./rendertest --fonts "$PWD/fonts" "Helvetica" samples/render/render_pgs_zlib.mkv 2>&1 \
                | grep -i -E "PASS|FAIL|sub-add|external|sup|pgs|demux|lavf|probe|format|open" | head -40 | tee -a rendertest.log || true
            done
          else
            echo "NO SUBTITLE FILE FROM JELLYFIN" | tee -a rendertest.log
          fi
          RENDERTEST_DEMUXER=lavf ./rendertest --fonts "$PWD/fonts" "Helvetica" samples/render/*.mkv samples/render/*.ts 2>&1 | tee -a rendertest.log || true

      - name: Publish format test log to the ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/cilog && cd /tmp/cilog
          git init -q && git checkout -q -b ci-logs
          { echo "run ${{ github.run_id }}"; cat "$GITHUB_WORKSPACE/rendertest.log" 2>/dev/null || true; echo "--- formats"; cat "$GITHUB_WORKSPACE/formattest.log" 2>/dev/null || true; echo "--- link/build"; cat "$GITHUB_WORKSPACE/link.log" 2>/dev/null || true; echo "--- samples"; cat "$GITHUB_WORKSPACE/samples.log" 2>/dev/null || true; } > formattest.txt
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "format log ${{ github.run_id }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs:ci-logs-formats

      - name: Upload format test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: format-test
          path: formattest.log
          if-no-files-found: ignore
