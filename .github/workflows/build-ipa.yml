name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # GitHub's Xcode 27 image (macOS 27, Apple Silicon) — iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AniTrack.xcodeproj \
            -scheme AniTrack \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/AniTrack.app
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AniTrack.ipa Payload
          ls -lh AniTrack.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: AniTrack-ipa
          path: AniTrack.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
