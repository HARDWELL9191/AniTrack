name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "tools/**"
      - ".github/workflows/api-check.yml"
      - "README.md"
  workflow_dispatch:

jobs:
  build:
    # GitHub's Xcode 27 image (macOS 27, Apple Silicon) — iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Use custom icon if provided
        run: |
          # Drop any square image named custom-icon.png (or .jpg) in the repo root to use it as the app icon.
          for f in custom-icon.png custom-icon.jpg custom-icon.jpeg; do
            if [ -f "$f" ]; then
              echo "Using $f as the app icon"
              sips -s format png -z 1024 1024 "$f" --out AniTrack/Assets.xcassets/AppIcon.appiconset/AppIcon.png
              break
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AniTrack.xcodeproj \
            -scheme AniTrack \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/AniTrack.app
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AniTrack.ipa Payload
          ls -lh AniTrack.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: AniTrack-ipa
          path: AniTrack.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
