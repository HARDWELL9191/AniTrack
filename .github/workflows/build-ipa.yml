name: Build IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - "tools/**"
      - ".github/workflows/api-check.yml"
      - "README.md"
  workflow_dispatch:

# Publishing the "AniReco (latest build)" release needs write access to the repo's releases.
permissions:
  contents: write

jobs:
  build:
    # GitHub's Xcode 27 image (macOS 27, Apple Silicon) — iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Test Excel export writer
        run: |
          set -euo pipefail
          mkdir -p build-test
          xcrun swiftc AniReco/Services/XLSXWriter.swift tools/xlsx_test/main.swift -o build-test/xlsx_test
          build-test/xlsx_test build-test/sample.xlsx
          python3 -m venv build-test/venv
          build-test/venv/bin/pip install --quiet openpyxl
          build-test/venv/bin/python tools/xlsx_test/verify.py build-test/sample.xlsx

      - name: Upload sample workbook
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xlsx-sample
          path: build-test/sample.xlsx
          if-no-files-found: ignore

      - name: Use custom icon if provided
        run: |
          # Drop any square image named custom-icon.png (or .jpg) in the repo root to use it as the app icon.
          for f in custom-icon.png custom-icon.jpg custom-icon.jpeg; do
            if [ -f "$f" ]; then
              echo "Using $f as the app icon"
              sips -s format png -z 1024 1024 "$f" --out AniReco/Assets.xcassets/AppIcon.appiconset/AppIcon.png
              break
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project AniReco.xcodeproj \
            -scheme AniReco \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            build | tee build.log

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/AniReco.app
          test -d "$APP"
          # Version 1.0.<build number>, build <build number>: every build counts up (AltStore compares them).
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          echo "AniReco $VERSION (build $BUILD)"
          test "$VERSION" = "1.0.${{ github.run_number }}" && test "$BUILD" = "${{ github.run_number }}"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AniReco.ipa Payload
          ls -lh AniReco.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: AniReco-ipa
          path: AniReco.ipa
          if-no-files-found: error

      # Every build of main replaces the "AniReco (latest build)" release, so the newest IPA is always
      # on the repo's Releases page next to JellyReco's. (A pre-release, like JellyReco's builds.)
      - name: Publish "AniReco (latest build)"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="AniReco for iPhone 1.0.${{ github.run_number }} (build ${{ github.run_number }}) from ${GITHUB_SHA::7}. Install AniReco.ipa with AltStore or Sideloadly."
          gh release delete anireco-latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create anireco-latest AniReco.ipa -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AniReco 1.0.${{ github.run_number }} (latest build)" --notes "$NOTES" --prerelease

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
