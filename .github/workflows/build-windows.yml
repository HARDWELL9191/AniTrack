name: Build Windows (ARM64)

on:
  push:
    branches: [windows]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Windows 11 on ARM (Snapdragon-class Arm64 machine), so everything builds natively for ARM64.
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Rust (aarch64-pc-windows-msvc)
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            ./rustup-init.exe -y --profile minimal --default-toolchain stable
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-pc-windows-msvc
          rustc -vV
          node -v

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/src-tauri/target
          key: cargo-win-arm64-${{ hashFiles('windows/src-tauri/Cargo.lock') }}
          restore-keys: cargo-win-arm64-

      - name: Install packages
        run: npm ci

      - name: On-device AI files (ONNX Runtime + QNN plugin, bge-small)
        run: ./tools/prepare_ai.ps1

      # The AI writer's model packages: size + SHA-256 for the app's download check, after the
      # app's own unpack-and-check code ran on the real packages. Cached: only redone when the
      # model links change (tools/llm_manifest.py).
      - uses: actions/cache@v5
        id: llm-manifest
        with:
          path: windows/src-tauri/resources/ai/llm-models.json
          key: llm-models-${{ hashFiles('windows/tools/llm_manifest.py') }}

      - name: AI writer model packages (Qwen3 4B for Snapdragon X / X2)
        if: steps.llm-manifest.outputs.cache-hit != 'true'
        working-directory: windows/src-tauri
        run: |
          cargo build --release --example llm_check --target aarch64-pc-windows-msvc
          python -I ../tools/llm_manifest.py resources/ai/llm-models.json target/aarch64-pc-windows-msvc/release/examples/llm_check.exe "$env:RUNNER_TEMP/llm"
          if ($LASTEXITCODE -ne 0) { throw "model package check failed" }

      - name: Build the installer
        run: npx tauri build --target aarch64-pc-windows-msvc --bundles nsis

      # Same target and profile as the installer build, so these reuse what it compiled.
      - name: Tests (tokenizer, vector store, token encryption)
        working-directory: windows/src-tauri
        run: cargo test --release --lib --target aarch64-pc-windows-msvc

      - name: AI check (real model, this runner has no NPU so it runs on the CPU)
        working-directory: windows/src-tauri
        run: |
          cargo build --release --example embed_check --target aarch64-pc-windows-msvc
          python -I ../tools/ai_check.py target/aarch64-pc-windows-msvc/release/examples/embed_check.exe resources/ai "$env:RUNNER_TEMP/ai-check"
          if ($LASTEXITCODE -ne 0) { throw "AI check failed" }

      - name: AI writer check (the installed app's helper process, with Genie.dll from the AI folder)
        run: |
          $exe = "src-tauri/target/aarch64-pc-windows-msvc/release/anireco.exe"
          $ai = (Resolve-Path src-tauri/resources/ai).Path
          $bundle = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/llm-empty"
          '{"cmd":"status"}' | Set-Content "$bundle/genie_config.json"
          # The app is a windowed exe: start it explicitly with pipes (as the app itself does).
          $psi = [System.Diagnostics.ProcessStartInfo]::new((Resolve-Path $exe).Path)
          foreach ($a in "--llm-helper", $ai, $bundle.FullName) { $psi.ArgumentList.Add($a) }
          $psi.UseShellExecute = $false; $psi.RedirectStandardInput = $true; $psi.RedirectStandardOutput = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          $p.StandardInput.WriteLine('{"cmd":"status"}'); $p.StandardInput.Close()
          $reply = $p.StandardOutput.ReadToEnd()
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "the helper process didn't exit" }
          Write-Host "::notice::AI writer helper (no model, expected to report a config error): $reply"
          if (-not $reply) { throw "the helper process didn't answer" }
          if ($reply -match "couldn't load|has no Genie") { throw "Genie.dll didn't load: $reply" }
          Get-Content src-tauri/resources/ai/llm-models.json | Write-Host

      - name: Collect the .exe
        id: exe
        run: |
          $setup = Get-ChildItem src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw "No installer was produced" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $setup.FullName out/AniReco-Setup-arm64.exe
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: AniReco-Windows-ARM64
          path: windows/out/AniReco-Setup-arm64.exe
          if-no-files-found: error
