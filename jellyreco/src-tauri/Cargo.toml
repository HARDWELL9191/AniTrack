[package]
name = "jellyreco"
version = "1.0.0"
description = "JellyReco: a Jellyfin client for Windows on Arm with an mpv engine and personal picks"
edition = "2021"
rust-version = "1.92"

[lib]
name = "jellyreco_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-http = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
unicode-normalization = "0.1"
# libmpv-2.dll is loaded at run time from the app's folder (no import library needed).
libloading = "0.9"
raw-window-handle = "0.6"
# ONNX Runtime for the For You tab's on-device AI (same engine as AniReco), loaded at run time.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Power",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
